name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate kustomize overlays and scenarios
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for o in gke-autopilot rke2; do
            kubectl kustomize "deploy/overlays/$o" | ./kubeconform -strict -summary -kubernetes-version 1.33.0 -
          done
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 scenarios/*.yaml
      - name: shellcheck
        run: shellcheck scripts/*.sh scenarios/run.sh

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: [gke-autopilot, rke2]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  image:
    needs: [agent-tests]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/k8s-self-healing-agent
          tags: |
            type=semver,pattern={{version}}
            type=sha
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
