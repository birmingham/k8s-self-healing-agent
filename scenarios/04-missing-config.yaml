# Scenario 4: a brand-new service ships without a required setting. There is
# no earlier revision to roll back to and a restart can't conjure a missing
# env var. Expected: agent ESCALATES with a diagnosis and touches nothing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: healer-demo
  labels:
    healer.birmingham.github.io/scenario: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        healer.birmingham.github.io/managed: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "orders-api v1.0.0 starting"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set"
                exit 78
              fi
              echo "connected"; while true; do sleep 30; done
          env:
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
