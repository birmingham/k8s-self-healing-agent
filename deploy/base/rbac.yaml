apiVersion: v1
kind: ServiceAccount
metadata:
  name: healer
  namespace: healer-system
---
# Least privilege: read what diagnosis needs, write only what the three
# remediations need. No secrets, no exec, no cluster-scoped access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: healer
  namespace: healer-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]      # delete = restart_pod
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]                # patch = rollback, memory, state annotations
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: healer
  namespace: healer-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: healer
subjects:
  - kind: ServiceAccount
    name: healer
    namespace: healer-system
